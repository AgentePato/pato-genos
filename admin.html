<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Alérgenos</title>
    
    <link rel="stylesheet" href="style_admin.css">

</head>
<body>

    <!-- El pato ahora es una imagen física en la web -->
    <img src="pato_fondo.jpeg" class="foto-pato" alt="Pato Chef">

    <!-- Este contenedor se pone por encima del pato -->
    <div class="contenedor-superpuesto">
        
        <div id="adminBox" class="admin-box modo-login">
            <h2 id="admin-title">Pase VIP (Very Important Pato)<br>Contraseña:</h2>
            
            <div id="login-section">
                <input type="password" id="passInput" class="admin-input password-input" placeholder="••••••••">
                <button onclick="verificarContraseña()" class="btn btn-blue">Entrar a la cocina</button>
            </div>

            <div id="dashboard-section">
                <input type="text" id="searchAdmin" class="admin-input" placeholder="🔍 Buscar restaurante...">
                <button class="btn btn-green" onclick="abrirFormulario()">+ Añadir nuevo restaurante</button>
                <ul class="restaurant-list" id="listaRestaurantes">
                    <div style="padding: 20px; text-align: center; color: #64748b;">Cargando restaurantes...</div>
                </ul>
            </div>

            <div id="form-section">
                <input type="text" id="f-name" class="admin-input" placeholder="Nombre (ej: VIPS)">
                <input type="text" id="f-type" class="admin-input" placeholder="Dirección (ej: Av. Viñuelas, 45)">
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="f-lat" class="admin-input" placeholder="Latitud (ej: 40.59)" step="any">
                    <input type="number" id="f-lng" class="admin-input" placeholder="Longitud (ej: -3.70)" step="any">
                </div>
                
                <label style="display: flex; align-items: center; margin-bottom: 12px; font-weight: 500; cursor: pointer;">
                    <input type="checkbox" id="f-hasMenu" onchange="toggleMenuFields()" style="margin-right: 10px; width: 18px; height: 18px;">
                    ¿Tiene carta de alérgenos?
                </label>

                <div id="menu-fields" style="display: none; padding: 15px; background: rgba(255, 255, 255, 0.5); border-radius: 10px; margin-bottom: 15px;">
                    <select id="f-menuType" class="admin-input">
                        <option value="pdf">Documento PDF</option>
                        <option value="images">Varias Imágenes</option>
                    </select>
                    <input type="text" id="f-menuSrc" class="admin-input" placeholder="Ruta (ej: cartas/menu.pdf)" style="margin-bottom: 5px;">
                    <small style="color: #64748b; font-size: 0.8em; display: block; line-height: 1.2;">Si son varias imágenes, sepáralas por comas (ej: foto1.png, foto2.png)</small>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="btn btn-green" style="margin-bottom: 0;" onclick="guardarRestaurante()">Guardar</button>
                    <button class="btn btn-gray" onclick="cerrarFormulario()">Cancelar</button>
                </div>
            </div>
            
            <a href="index.html" class="btn-volver">← Volver al Mapa</a>
        </div>

    </div>

    <!-- Firebase y Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA9B5kr9lx2tPZDuF37xY5gpCSSfTLp6XI",
            authDomain: "directorioalergenos.firebaseapp.com",
            projectId: "directorioalergenos",
            storageBucket: "directorioalergenos.firebasestorage.app",
            messagingSenderId: "25958692428",
            appId: "1:25958692428:web:a31a6e4444566d0e5aa6e9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let restaurants = [];
        let editingId = null;

        window.verificarContraseña = async function() {
            const pass = document.getElementById('passInput').value;
            if (pass === "cuac123") {
                document.getElementById('login-section').style.display = 'none';
                
                const box = document.getElementById('adminBox');
                box.classList.remove('modo-login');
                box.classList.add('modo-panel');
                document.getElementById('admin-title').innerHTML = 'Panel de Control ⚙️';
                
                setTimeout(() => { document.getElementById('dashboard-section').style.display = 'block'; }, 300);
                await cargarDatos();
            } else {
                alert("❌ Contraseña incorrecta. ¡Cuac!");
                document.getElementById('passInput').value = "";
            }
        }

        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verificarContraseña();
        });

        async function cargarDatos() {
            try {
                const querySnapshot = await getDocs(collection(db, "restaurantes"));
                restaurants = [];
                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    data.id = doc.id;
                    restaurants.push(data);
                });
                renderLista(document.getElementById('searchAdmin').value);
            } catch (error) {
                document.getElementById('listaRestaurantes').innerHTML = '<div style="color: red; padding: 20px;">Error al conectar con la base de datos.</div>';
            }
        }

        function renderLista(filtro) {
            const listaDiv = document.getElementById('listaRestaurantes');
            listaDiv.innerHTML = '';
            const lowerFilter = filtro.toLowerCase();
            const filtrados = restaurants.filter(r => r.name && r.name.toLowerCase().includes(lowerFilter));

            if (filtrados.length === 0) {
                listaDiv.innerHTML = '<div style="padding: 20px; text-align: center; color: #64748b;">No se encontraron restaurantes.</div>';
                return;
            }

            filtrados.forEach(rest => {
                const li = document.createElement('li');
                li.className = 'restaurant-item';
                li.innerHTML = `
                    <span class="item-name" title="${rest.name}">${rest.name}</span>
                    <div class="action-btns">
                        <button class="btn-small bg-orange" onclick="abrirFormulario('${rest.id}')">✏️ Editar</button>
                        <button class="btn-small bg-red" onclick="borrarRestaurante('${rest.id}', '${rest.name}')">🗑️ Borrar</button>
                    </div>
                `;
                listaDiv.appendChild(li);
            });
        }

        document.getElementById('searchAdmin').addEventListener('input', (e) => {
            renderLista(e.target.value);
        });

        window.toggleMenuFields = function() {
            const hasMenu = document.getElementById('f-hasMenu').checked;
            document.getElementById('menu-fields').style.display = hasMenu ? 'block' : 'none';
        }

        window.abrirFormulario = function(id = null) {
            editingId = id;
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
            document.getElementById('admin-title').innerHTML = id ? 'Editar Restaurante ✏️' : 'Añadir Restaurante ➕';

            if (id) {
                const rest = restaurants.find(r => r.id === id);
                document.getElementById('f-name').value = rest.name || '';
                document.getElementById('f-type').value = rest.type || '';
                document.getElementById('f-lat').value = rest.lat || '';
                document.getElementById('f-lng').value = rest.lng || '';
                
                document.getElementById('f-hasMenu').checked = rest.hasMenu || false;
                document.getElementById('f-menuType').value = rest.menuType || 'pdf';
                
                if (Array.isArray(rest.menuSrc)) {
                    document.getElementById('f-menuSrc').value = rest.menuSrc.join(', ');
                } else {
                    document.getElementById('f-menuSrc').value = rest.menuSrc || '';
                }
            } else {
                document.getElementById('f-name').value = '';
                document.getElementById('f-type').value = '';
                document.getElementById('f-lat').value = '';
                document.getElementById('f-lng').value = '';
                document.getElementById('f-hasMenu').checked = false;
                document.getElementById('f-menuType').value = 'pdf';
                document.getElementById('f-menuSrc').value = '';
            }
            toggleMenuFields();
        }

        window.cerrarFormulario = function() {
            document.getElementById('form-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            document.getElementById('admin-title').innerHTML = 'Panel de Control ⚙️';
        }

        window.guardarRestaurante = async function() {
            const name = document.getElementById('f-name').value.trim();
            const type = document.getElementById('f-type').value.trim();
            const lat = parseFloat(document.getElementById('f-lat').value);
            const lng = parseFloat(document.getElementById('f-lng').value);
            const hasMenu = document.getElementById('f-hasMenu').checked;
            const menuType = document.getElementById('f-menuType').value;
            let menuSrc = document.getElementById('f-menuSrc').value.trim();

            if (!name) return alert("❌ El nombre es obligatorio.");
            if (isNaN(lat) || isNaN(lng)) return alert("❌ Las coordenadas deben ser números.");

            if (hasMenu && menuType === 'images') {
                menuSrc = menuSrc.split(',').map(s => s.trim()).filter(s => s !== "");
            }

            const dataToSave = {
                name, type, lat, lng, 
                hasMenu: hasMenu,
                menuType: hasMenu ? menuType : "",
                menuSrc: hasMenu ? menuSrc : ""
            };

            try {
                event.target.disabled = true;
                event.target.innerHTML = "Guardando...";

                if (editingId) {
                    const docRef = doc(db, "restaurantes", editingId);
                    await updateDoc(docRef, dataToSave);
                } else {
                    await addDoc(collection(db, "restaurantes"), dataToSave);
                }
                
                await cargarDatos();
                cerrarFormulario();
            } catch (error) {
                alert("❌ Error al guardar: " + error.message);
            } finally {
                event.target.disabled = false;
                event.target.innerHTML = "Guardar";
            }
        }

        window.borrarRestaurante = async function(id, name) {
            if (confirm(`⚠️ ¿Estás completamente seguro de que quieres eliminar '${name}'?\n\nEsta acción no se puede deshacer.`)) {
                try {
                    await deleteDoc(doc(db, "restaurantes", id));
                    await cargarDatos(); 
                } catch (error) {
                    alert("❌ Error al borrar: " + error.message);
                }
            }
        }
    </script>
</body>
</html>
