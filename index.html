<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Alérgenos</title>
    <meta name="description" content="Mapa de restaurantes con sus cartas de alérgenos.">
    <link rel="icon" href="img/pato_boton.jpeg">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/main.js"></script>
</head>
<body>
    <header>
        <h1>Directorio de Alérgenos</h1>
        <p>Encuentra restaurantes seguros cerca de ti</p>

        <a href="admin.html" title="Panel de Administración">
            <img src="img/pato_boton.jpeg" alt="Admin" class="admin-btn">
        </a>
    </header>

    <!-- El dibujo 100% visible y debajo de la franja -->
    <div class="dibujo-cabecera" role="img" aria-label="Patos cocinando"></div>

    <main class="container">
        <div class="warning">
            ⚠️ <b>Aviso:</b> La información mostrada es orientativa. Informa siempre al personal del restaurante sobre tus alergias antes de pedir.
        </div>

        <div class="toolbar">
            <input type="search" id="searchInput" class="search-input" placeholder="🔍 Buscar restaurante, zona o cocina...">
            <button type="button" id="addButton" class="add-btn">＋ Añadir restaurante</button>
        </div>

        <div class="chips" id="quickFilters"></div>
        <div class="chips chips--allergens" id="allergenFilters" aria-label="Alérgenos que quiero evitar"></div>

        <div id="map"></div>

        <div class="results-head">
            <span id="resultCount"></span>
            <span id="modeBadge" class="mode-badge" hidden>Modo demo</span>
        </div>
        <div id="restaurant-list">
            <div class="placeholder-message">Conectando con la base de datos... 📡</div>
        </div>
    </main>

    <dialog id="addDialog" class="add-dialog">
        <form method="dialog" class="add-dialog__head">
            <h2>Añadir restaurante</h2>
            <button class="close-btn" aria-label="Cerrar">✕</button>
        </form>
        <p class="muted" id="addProvider"></p>
        <input type="search" id="addSearch" class="search-input" placeholder="Nombre del restaurante..." autocomplete="off">
        <div id="addResults" class="add-results"></div>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
